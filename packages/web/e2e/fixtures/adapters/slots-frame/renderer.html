<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Slots frame fixture</title>
<body>
<output id="state" aria-label="Renderer state">Waiting for state</output>
<script>
window.addEventListener("message", (event) => {
  if (event.source !== window.parent || event.data?.type !== "render") return;
  const value = event.data.state?.value;
  document.getElementById("state").textContent = typeof value === "string" ? value : "Missing state";
  window.parent.postMessage({ type: "resize", height: 110 }, "*");
});
</script>
</body>
</html>
