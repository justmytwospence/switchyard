name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  # Production moves only from main (scripts/promote.sh fast-forwards it to a green dev).
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::v* tags must point at a commit on main (scripts/promote.sh first)"; exit 1; }
  image:
    needs: on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/justmytwospence/switchyard
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  npm:
    needs: on-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (GitHub OIDC) needs npm >= 11.5.
      - run: npm install -g npm@latest
      # The smoke test starts a standalone coordinator and host; the host needs Pi.
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - run: pi --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:npm
      - run: bash scripts/smoke-npm.sh
      - run: pnpm build:client-npm
      - run: pnpm test:client-npm
      - name: Publish both packages (skip only exact published versions)
        shell: bash
        run: |
          set -euo pipefail
          for directory in dist-npm dist-client-npm; do
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")
            error=$(mktemp)
            if npm view "$name@$version" version > /dev/null 2> "$error"; then
              echo "$name@$version is already published"
            elif grep -qE 'E404|ETARGET' "$error"; then
              npm publish "./$directory" --access public --provenance
            else
              echo "Registry lookup failed for $name@$version:" >&2
              sed -n '1,60p' "$error" >&2
              rm -f "$error"
              exit 1
            fi
            rm -f "$error"
          done
