name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  # Production moves only from main (scripts/promote.sh fast-forwards it to a green dev).
  on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::v* tags must point at a commit on main (scripts/promote.sh first)"; exit 1; }
  image:
    needs: on-main
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, cache: buildkit }
          - { arch: arm64, runner: ubuntu-24.04-arm, cache: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/justmytwospence/switchyard
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/justmytwospence/switchyard,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  # One multi-platform tag (version and latest) from the two digests.
  image-merge:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/justmytwospence/switchyard
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - working-directory: ${{ runner.temp }}/digests
        run: |
          # word splitting builds the argument lists
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/justmytwospence/switchyard@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/justmytwospence/switchyard:${{ steps.meta.outputs.version }}"
  npm:
    needs: on-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (GitHub OIDC) needs npm >= 11.5.
      - run: npm install -g npm@latest
      # The smoke test starts a standalone coordinator and host; the host needs Pi.
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - run: pi --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:npm
      - run: bash scripts/smoke-npm.sh
      - run: pnpm build:client-npm
      - run: pnpm test:client-npm
      - name: Publish both packages (skip only exact published versions)
        shell: bash
        run: |
          set -euo pipefail
          for directory in dist-npm dist-client-npm; do
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")
            error=$(mktemp)
            if npm view "$name@$version" version > /dev/null 2> "$error"; then
              echo "$name@$version is already published"
            elif grep -qE 'E404|ETARGET' "$error"; then
              npm publish "./$directory" --access public --provenance
            else
              echo "Registry lookup failed for $name@$version:" >&2
              sed -n '1,60p' "$error" >&2
              rm -f "$error"
              exit 1
            fi
            rm -f "$error"
          done
