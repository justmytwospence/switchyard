name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      # Real-Pi tests run against the pinned, tested Pi release with a local mock model.
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - run: pi --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

  # Every green push to a branch other than main publishes the coordinator image: dev as :dev
  # (dev.switchyard, scripts/deploy-dev.sh), any other branch as :br-<slug> (scripts/preview-slug.sh,
  # for scripts/preview.sh), each also as :sha-<short>. main moves only by fast-forward to a green
  # dev (scripts/promote.sh); production images and the npm package come only from v* tags on
  # main (release.yml).
  image:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: slug
        run: echo "slug=$(bash scripts/preview-slug.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/justmytwospence/switchyard
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=br-${{ steps.slug.outputs.slug }},enable=${{ github.ref != 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
