name: ci
# main and v* tags only ever point at commits that already passed here on dev (scripts/promote.sh),
# so pushes to main and tags do not run CI again.
on:
  push:
    branches-ignore: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast feedback: compile, lint, test tiers and the client SDK tarball (no Pi needed).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test:tiers
      - run: pnpm skill:check
      - run: pnpm test:fast
      - run: pnpm build:client-npm
      - run: pnpm test:client-npm

  test:
    name: test (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      # Real-Pi tests run against the pinned, tested Pi release with a local mock model.
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - run: pi --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Past durations let Vitest start each shard's slowest files first.
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: vitest-${{ matrix.shard }}-
      # hanging-process names whatever keeps a worker alive if the run does not exit.
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/5 --reporter=default --reporter=hanging-process

  # A browser smoke test against the real stack; gates promote.sh with the rest of the run.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: test-results
          retention-days: 7

  plugin-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.4.0", "1.5.2", "1.6.0"]
    env:
      SWITCHYARD_REQUIRE_PI_PLUGINS: "1"
      SWITCHYARD_PI_PLUGINS_DIR: ${{ github.workspace }}/../pi-plugins
      TYPESAFE_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: npm install -g @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: |
          commit=$(node -p "require('./.github/compat-pi-plugins.json').commit")
          git clone --no-checkout https://github.com/justmytwospence/pi-plugins.git "$SWITCHYARD_PI_PLUGINS_DIR"
          git -C "$SWITCHYARD_PI_PLUGINS_DIR" checkout --detach "$commit"
          npm ci --prefix "$SWITCHYARD_PI_PLUGINS_DIR"
          for component in pi-ask-user-question pi-tool-gate pi-plan-mode pi-subagents pi-todo pi-bg; do
            npm ci --prefix "$SWITCHYARD_PI_PLUGINS_DIR/packages/$component"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test scripts/check-plugin-compat.test.mjs
      - run: pnpm test:plugins

  # Every push to a branch publishes the coordinator image as soon as it builds, in parallel with
  # the tests: dev as :dev (dev.switchyard, scripts/deploy-dev.sh), any other branch as
  # :br-<slug> (scripts/preview-slug.sh, for scripts/preview.sh), each also as :sha-<short>.
  # These are review deployments; production is gated on the whole run: main moves only by
  # fast-forward to a dev whose CI run (tests included) is green (scripts/promote.sh), and
  # production images and the npm package come only from v* tags on main (release.yml).
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: slug
        run: echo "slug=$(bash scripts/preview-slug.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/justmytwospence/switchyard
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=br-${{ steps.slug.outputs.slug }},enable=${{ github.ref != 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
